[project]
name = "projet-deep-learning"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.1",
    "torchvision",
    "numpy",
    "matplotlib",
    # ajoute ici tes autres paquets (pandas, scikit-learn...)
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true